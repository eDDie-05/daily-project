name: Daily project generator

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/daily-project.yml
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-project-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out generator
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and publish a private project repository
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GH_CREATE_REPO_TOKEN: ${{ secrets.GH_CREATE_REPO_TOKEN }}
          GITHUB_OWNER: eDDie-05
        run: python scripts/generate_daily_project.py
