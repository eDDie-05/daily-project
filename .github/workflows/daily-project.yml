name: Daily project generator
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_CREATE_REPO_TOKEN: ${{ secrets.GH_CREATE_REPO_TOKEN }}
          GITHUB_OWNER: eDDie-05
        run: python scripts/generate_daily_project.py
